# `ant server deploy` end to end (D-047): the GitHub Ubuntu runner plays the
# user's Linux server. A real sshd with a fresh key, a real deploy over SSH
# (systemd services, service account, tokens), status through the tunnel, a
# real build on the server via `ant remote run --server`, `ant build --on`
# with Rust installed for the service account (D-048), several workers
# building independent actions at once with a measured speedup (D-050), an idempotent
# redeploy, and a check that the coordinator is not reachable from outside.
name: server-deploy

on:
  workflow_dispatch:
  push:
    branches: ["p8-*"]
  pull_request:
    paths:
      - crates/ant-cli/src/server.rs
      - crates/ant-remote/src/worker.rs
      - crates/ant-remote/src/client.rs
      - .github/workflows/server-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build ant (release)
        run: cargo build --release --locked -p ant-cli
      - name: Start an SSH server that accepts this user's new key
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q openssh-server
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 755 ~ && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new runner@127.0.0.1 'echo ssh ok'
      - name: ant server deploy
        env:
          ANT_DATA_HOME: ${{ runner.temp }}/ant-data
        run: target/release/ant server deploy runner@127.0.0.1 --binary target/release/ant --name ci --toolchain rust --workers 4
      - name: ant server status / list
        env:
          ANT_DATA_HOME: ${{ runner.temp }}/ant-data
        run: |
          target/release/ant server list
          for i in $(seq 20); do
            target/release/ant server status ci | tee status.txt
            grep -q "4 workers online" status.txt && break
            sleep 1
          done
          grep -q "4 workers online" status.txt
      - name: A real build on the server through the tunnel
        env:
          ANT_DATA_HOME: ${{ runner.temp }}/ant-data
        run: |
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          echo "hello from the laptop" > in.txt
          cat > plan.json <<'EOF'
          {"schema_version": 1, "actions": [{"action": {
            "schema_version": 1, "id": "on-server",
            "argv": ["sh", "-c", "{ cat in.txt; echo built on $(hostname) as $(id -un); } > out.txt"],
            "working_directory": ".",
            "inputs": [{"path": "in.txt", "kind": "file"}],
            "outputs": [{"path": "out.txt", "kind": "file"}],
            "environment": [], "cache_policy": "never"},
            "dependencies": []}]}
          EOF
          "$GITHUB_WORKSPACE/target/release/ant" remote run --server ci --plan plan.json --workspace .
          cat out.txt
          grep -q "hello from the laptop" out.txt
          grep -q "as ant" out.txt
      - name: ant build --on offloads a cargo project, incrementally (D-048)
        env:
          ANT_DATA_HOME: ${{ runner.temp }}/ant-data
          ANT_CACHE_HOME: ${{ runner.temp }}/ant-cache
        run: |
          cd "$RUNNER_TEMP" && cargo new --quiet hello && cd hello
          cargo generate-lockfile --quiet
          ant="$GITHUB_WORKSPACE/target/release/ant"
          start=$(date +%s.%N)
          "$ant" build --on ci 2>&1 | tee "$RUNNER_TEMP/build1.txt"
          first=$(echo "$(date +%s.%N) - $start" | bc)
          grep -q "on ci" "$RUNNER_TEMP/build1.txt"
          # cargo's own output, streamed live from the server (D-049).
          grep -q "Compiling hello" "$RUNNER_TEMP/build1.txt"
          ./dist/hello | tee "$RUNNER_TEMP/run1.txt"
          grep -q "Hello, world!" "$RUNNER_TEMP/run1.txt"
          # Built by the server's own toolchain, as the ant user, in a kept
          # workspace: cargo's target/ is still there for the next build.
          sudo sh -c 'ls -d /var/lib/ant/worker*/projects/*/target/release' | tee "$RUNNER_TEMP/kept.txt"
          [ "$(wc -l < "$RUNNER_TEMP/kept.txt")" = 1 ]
          sudo sh -c 'stat -c %U /var/lib/ant/worker*/projects/*/target/release/hello' | grep -qx ant
          # Edit one file: only that change is sent, the build is incremental.
          sed -i 's/Hello, world!/Hello again from the server!/' src/main.rs
          start=$(date +%s.%N)
          "$ant" build --on ci 2>&1 | tee "$RUNNER_TEMP/build2.txt"
          second=$(echo "$(date +%s.%N) - $start" | bc)
          # With four workers the rebuild still lands on the worker that
          # keeps this project's state (D-050).
          w1=$(grep -o 'worker=[^ ]*' "$RUNNER_TEMP/build1.txt")
          w2=$(grep -o 'worker=[^ ]*' "$RUNNER_TEMP/build2.txt")
          echo "first build on $w1, rebuild on $w2"
          [ "$w1" = "$w2" ]
          ./dist/hello | grep -q "Hello again from the server!"
          echo "first build ${first}s, after one edit ${second}s"
          # --local still builds on this machine.
          "$ant" build --local --dev
          ./dist/hello | grep -q "Hello again from the server!"
      - name: Several workers build independent actions at once (D-050)
        env:
          ANT_DATA_HOME: ${{ runner.temp }}/ant-data
        run: |
          ant="$GITHUB_WORKSPACE/target/release/ant"
          mkdir -p "$RUNNER_TEMP/parallel" && cd "$RUNNER_TEMP/parallel"
          # Four CPU-bound, independent actions (~1-2 s of hashing each).
          {
            echo '{"schema_version": 1, "actions": ['
            for i in 1 2 3 4; do
              [ "$i" = 1 ] || echo ','
              echo "{\"action\": {\"schema_version\": 1, \"id\": \"hash-$i\","
              echo " \"argv\": [\"sh\", \"-c\", \"head -c 2000000000 /dev/zero | sha256sum > out-$i.txt\"],"
              echo " \"working_directory\": \".\", \"inputs\": [],"
              echo " \"outputs\": [{\"path\": \"out-$i.txt\", \"kind\": \"file\"}],"
              echo " \"environment\": [], \"cache_policy\": \"never\"}, \"dependencies\": []}"
            done
            echo ']}'
          } > "$RUNNER_TEMP/parallel-plan.json"
          timed() {
            start=$(date +%s.%N)
            "$ant" remote run --server ci --plan "$RUNNER_TEMP/parallel-plan.json" --workspace . > "$RUNNER_TEMP/parallel-run.txt"
            echo "$(date +%s.%N) - $start" | bc
          }
          four=$(timed)
          [ "$(grep -o 'worker=[^ ]*' "$RUNNER_TEMP/parallel-run.txt" | sort -u | wc -l)" -ge 2 ]
          ls out-1.txt out-2.txt out-3.txt out-4.txt
          "$ant" server deploy runner@127.0.0.1 --binary "$ant" --name ci --toolchain rust --workers 1
          for i in $(seq 20); do "$ant" server status ci | grep -q "1 worker online" && break; sleep 1; done
          systemctl is-active --quiet ant-worker@2.service && { echo "extra worker still running" >&2; exit 1; }
          one=$(timed)
          echo "4 independent actions on $(nproc) cores: 1 worker ${one}s, 4 workers ${four}s, speedup $(echo "scale=2; $one / $four" | bc)x" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(echo "$one > 1.5 * $four" | bc)" = 1 ]
      - name: Redeploy keeps tokens and still works
        env:
          ANT_DATA_HOME: ${{ runner.temp }}/ant-data
        run: |
          before=$(sudo sha256sum /etc/ant/client.token)
          target/release/ant server deploy runner@127.0.0.1 --binary target/release/ant --name ci --toolchain rust
          [ "$before" = "$(sudo sha256sum /etc/ant/client.token)" ]
          target/release/ant server status ci
      - name: The coordinator is not reachable from outside the server
        run: |
          addr=$(hostname -I | awk '{print $1}')
          if curl -s --max-time 3 "http://$addr:8742/v1/health"; then echo "coordinator reachable on $addr" >&2; exit 1; fi
          curl -fsS http://127.0.0.1:8742/v1/health
          systemctl show ant-coordinator -p User -p NoNewPrivileges -p ProtectSystem
          # Tokens: readable by root and the ant group only (this test user
          # cannot even list them without sudo).
          if stat /etc/ant/client.token 2>/dev/null; then echo "token visible to other users" >&2; exit 1; fi
          sudo stat -c '%a %U:%G %n' /etc/ant /etc/ant/client.token /etc/ant/worker.token /var/lib/ant | tee perms.txt
          grep -q '^750 root:ant /etc/ant$' perms.txt
          grep -q '^640 root:ant /etc/ant/client.token$' perms.txt
          grep -q '^640 root:ant /etc/ant/worker.token$' perms.txt
      - name: Service logs
        if: always()
        run: sudo journalctl -u ant-coordinator -u ant-worker --no-pager | tail -60
