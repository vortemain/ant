# Remote shared-cache benchmark (P2.4): plain cargo vs `ant remote run`
# through a sandboxed Linux worker, on Ant itself. Manual, plus pushes to the
# measurement branch. Raw results are uploaded as an artifact and summarized.
name: bench

on:
  workflow_dispatch:
  push:
    branches: [p2-measure]

jobs:
  remote-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Prepare the Linux sandbox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build ant (release)
        run: cargo build --release -p ant-cli
      - name: Run the benchmark
        run: bash benchmarks/remote-cache/run.sh
      - name: Summary
        if: always()
        run: |
          {
            echo '## Remote cache benchmark (raw)'
            echo '```'
            cat benchmarks/remote-cache/out/environment.txt || true
            echo
            column -s, -t benchmarks/remote-cache/out/results.csv || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-cache-benchmark
          path: benchmarks/remote-cache/out
