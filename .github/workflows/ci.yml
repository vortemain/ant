# Ant CI: the quality gate (fmt, clippy -D warnings, full test suite) on
# Linux and Windows for every push. Runs on github.com/vortemain/ant.
name: ci

on:
  push:
  pull_request:

jobs:
  quality-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Quality gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Quality gate (POSIX)
        if: runner.os != 'Windows'
        run: sh ./scripts/check.sh
