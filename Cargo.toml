[workspace]
resolver = "3"
members = ["crates/ant-cli", "crates/ant-remote", "crates/ant-sandbox-win", "crates/build-action", "crates/build-adapter", "crates/build-cache", "crates/build-digest", "crates/build-events", "crates/build-graph", "crates/local-executor"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
os_info = "3.15.0"
# Remote execution transport (D-014): small synchronous HTTP server and
# client (rustls TLS for https coordinators behind a reverse proxy).
tiny_http = "0.12.0"
# Parses the optional ant.toml project file (D-017).
toml = "1.2"
ureq = "3.1"
# Release-signing keystore at-rest encryption (P4, D-036): AEAD for the
# sealed passwords. RustCrypto, pure Rust; the justification and the
# hand-rolled alternative it rejects are in docs/adr/0005.
aes-gcm = "0.10.3"
# Password-based key derivation for the same store (OWASP 2023: 600_000
# PBKDF2-HMAC-SHA256 iterations). "simple" supplies `pbkdf2_hmac`.
pbkdf2 = { version = "0.12.2", default-features = false, features = ["simple"] }
hmac = "0.12.1"
# Salt and nonce entropy from the OS (the only randomness source Ant needs).
getrandom = "0.3"
# Hidden (no-echo) prompts for passwords and the master passphrase.
rpassword = "7.4"

[workspace.lints.rust]
unsafe_code = "forbid"
