[package]
name = "ant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Local-first universal build infrastructure command line"

[[bin]]
name = "ant"
path = "src/main.rs"

[dependencies]
build-action = { path = "../build-action" }
ant-remote = { path = "../ant-remote" }
build-adapter = { path = "../build-adapter" }
build-cache = { path = "../build-cache" }
build-digest = { path = "../build-digest" }
build-events = { path = "../build-events" }
build-graph = { path = "../build-graph" }
local-executor = { path = "../local-executor" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Release-signing keystore at-rest encryption (P4, D-036; see docs/adr/0005).
aes-gcm.workspace = true
pbkdf2.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
# Hidden password prompts for `ant keystore import` and build-time unlock.
rpassword.workspace = true
# LAN serving of collected APKs for install-by-QR (P4): the same small
# synchronous HTTP server the remote coordinator uses.
tiny_http.workspace = true

[target.'cfg(windows)'.dependencies]
# DPAPI credential decryption and the sandbox runner's own-token restriction
# for network isolation (D-013). Safe API; the FFI lives in that crate.
ant-sandbox-win = { path = "../ant-sandbox-win" }

[dependencies.ctrlc]
# Installs a cooperative Ctrl+C handler that cancels running actions instead of
# terminating the process without cleanup. Justified in docs/plan.md.
version = "3.5.2"

[dev-dependencies]
# Raw HTTP checks of the coordinator dashboard headers in e2e tests.
ureq.workspace = true

[lints]
workspace = true
